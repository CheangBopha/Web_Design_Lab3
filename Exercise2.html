<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  body{
    margin:0;
  }

  .wrapper{
    height:100vh;
    background:#25384B;

    display:flex;
    gap:30px;
    padding:30px;
  }

  .left{
    flex:1;
    background:#A3CFCC;
  }

  .right{
    width:150px;
    background:#F7CFB6;

    display:flex;
    flex-direction:column;
    gap:15px;

    padding:15px;
  }

  .box{
    background:#86C2DE;
    height:90px;
  }
</style>

</head>
<body>

<div class="wrapper">

  <div class="left"></div>

  <div class="right">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div>

</div>

</body>
</html>
